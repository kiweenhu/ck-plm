# 前端容器内的 nginx 配置
# 职责：托管 dist 静态产物，并把 /api 与文件资源请求反代到 backend 容器。
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 后端单文件上限 50MB，这里留一点余量，避免上传卡在 nginx 这层
    client_max_body_size 60m;

    # 前端是 history 路由，刷新子路径要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流程部署 / BOM 大结构树展开会比较慢，别让 nginx 先超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 文件资源：/{tenantOid}/{category}/{fileName}，租户 oid 是 UUID
    location ~ ^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
